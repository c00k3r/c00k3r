<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="900" height="320" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Grid pattern -->
  <rect width="900" height="320" rx="12" fill="url(#grid)"/>
  <!-- Cyber Glow behind Shield -->
  <rect width="900" height="320" rx="12" fill="url(#cyanGlow)"/>

  <!-- Top Terminal Bar -->
  <circle cx="36" cy="32" r="5" fill="#00f5d4"/>
  <circle cx="52" cy="32" r="5" fill="#38bdf8"/>
  <circle cx="68" cy="32" r="5" fill="#818cf8"/>
  <text x="92" y="36" fill="#64748b" class="mono" font-size="11" font-weight="600" letter-spacing="2">C00K3R / SECURITY OPS LOG</text>

  <!-- Section Tag -->
  <text x="36" y="92" fill="#00f5d4" class="mono" font-size="11" font-weight="700" letter-spacing="2.5">CYBERSECURITY &amp; VAPT AUTOMATION</text>

  <!-- Main Name Title -->
  <text x="36" y="142" fill="#f8fafc" class="sans" font-size="40" font-weight="800" letter-spacing="-0.5">Mrityunjay Guleria</text>

  <!-- Tagline -->
  <text x="36" y="174" fill="#94a3b8" class="sans" font-size="15" font-weight="400">Recon. Exploit. Automate. Secure.</text>

  <!-- Terminal Command Line -->
  <text x="36" y="214" fill="#38bdf8" class="mono" font-size="13">> executing offensive recon &amp; vapt automation</text>
  <rect x="420" y="202" width="8" height="15" fill="#00f5d4">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD Badges -->
  <g transform="translate(36, 246)">
    <rect width="145" height="32" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="72" y="20" fill="#cbd5e1" class="mono" font-size="10.5" font-weight="600" text-anchor="middle">01 / RECON &amp; OSINT</text>
  </g>
  <g transform="translate(193, 246)">
    <rect width="155" height="32" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="77" y="20" fill="#cbd5e1" class="mono" font-size="10.5" font-weight="600" text-anchor="middle">02 / VAPT AUTOMATION</text>
  </g>
  <g transform="translate(360, 246)">
    <rect width="165" height="32" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="82" y="20" fill="#cbd5e1" class="mono" font-size="10.5" font-weight="600" text-anchor="middle">03 / THREAT DETECTION</text>
  </g>

  <!-- Right Shield HUD Graphic -->
  <g transform="translate(735, 140)">
    <!-- Outer radar rings -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00f5d4" stroke-opacity="0.15" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>
    
    <!-- Shield Graphic -->
    <path d="M 0 -45 C 28 -45 42 -35 42 -10 C 42 25 15 48 0 55 C -15 48 -42 25 -42 -10 C -42 -35 -28 -45 0 -45 Z" 
          fill="#0c1527" stroke="#00f5d4" stroke-width="2"/>
    
    <!-- Crosshair Target / Lens inside Shield -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="-20" x2="0" y2="-10" stroke="#00f5d4" stroke-width="2"/>
    <line x1="0" y1="10" x2="0" y2="20" stroke="#00f5d4" stroke-width="2"/>
    <line x1="-20" y1="0" x2="-10" y2="0" stroke="#00f5d4" stroke-width="2"/>
    <line x1="10" y1="0" x2="20" y2="0" stroke="#00f5d4" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#00f5d4"/>

    <!-- Caption Under Shield -->
    <text x="0" y="80" fill="#64748b" class="mono" font-size="9.5" font-weight="600" text-anchor="middle" letter-spacing="2">RECON / EXPLOIT / SECURE</text>
  </g>
</svg>
